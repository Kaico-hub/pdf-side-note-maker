<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PDFの右側にノート欄を追加します。" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>PDF Note Margin Maker</title>
    <link rel="stylesheet" href="./styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
    ></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="./">PDF Note Margin Maker</a>
      <a href="https://github.com/Kaico-hub/pdf-side-note-maker" rel="noreferrer">GitHub</a>
    </header>

    <main>
      <section class="maker" aria-labelledby="maker-title">
        <div class="section-heading">
          <div>
            <h1 id="maker-title">フェルマーもにっこり PDFにノート欄を追加</h1>
          </div>
        </div>

        <div class="maker-grid">
          <div class="control-panel">
            <label class="drop-zone" id="drop-zone" for="pdf-input">
              <input id="pdf-input" type="file" accept="application/pdf,.pdf" />
              <span class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M16 22V7M10 13l6-6 6 6M7 21v5h18v-5" />
                </svg>
              </span>
              <span class="drop-title">PDFをここにドロップ</span>
              <span class="drop-subtitle">または <span>ファイルを選択</span></span>
            </label>

            <div class="file-card" id="file-card" hidden>
              <span class="file-icon" aria-hidden="true">PDF</span>
              <span class="file-details">
                <strong id="file-name"></strong>
                <small id="file-size"></small>
              </span>
              <button class="icon-button" id="remove-file" type="button" aria-label="選択を解除">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m7 7 10 10M17 7 7 17" />
                </svg>
              </button>
            </div>

            <fieldset class="setting-group">
              <legend>ノート欄の幅</legend>
              <div class="ratio-options">
                <label>
                  <input type="radio" name="ratio" value="0.5" />
                  <span><strong>50%</strong><small>ちょっと</small></span>
                </label>
                <label>
                  <input type="radio" name="ratio" value="0.65" />
                  <span><strong>65%</strong><small>そのまま</small></span>
                </label>
                <label>
                  <input type="radio" name="ratio" value="1" checked />
                  <span><strong>100%</strong><small>いっぱい</small></span>
                </label>
              </div>
              <label class="custom-ratio">
                <input type="radio" name="ratio" value="custom" />
                <span>カスタム</span>
                <span class="number-field">
                  <input
                    id="custom-ratio"
                    type="number"
                    min="10"
                    max="300"
                    step="5"
                    value="80"
                    aria-label="カスタム幅の割合"
                    disabled
                  />
                  <span>%</span>
                </span>
              </label>
            </fieldset>

            <div class="setting-row">
              <span>
                <strong>横罫線</strong>
                <small>手書き用のガイド線を追加します</small>
              </span>
              <label class="switch">
                <input id="ruled" type="checkbox" checked />
                <span aria-hidden="true"></span>
                <span class="sr-only">横罫線を追加する</span>
              </label>
            </div>

            <button class="convert-button" id="convert-button" type="button" disabled>
              <span>ノート欄付きPDFを作成</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M14 7l5 5-5 5" />
              </svg>
            </button>

            <div class="status" id="status" aria-live="polite" hidden>
              <div class="status-line">
                <span id="status-text">PDFを準備しています…</span>
                <span id="status-percent">0%</span>
              </div>
              <div class="progress-track"><span id="progress-bar"></span></div>
            </div>

            <div class="result-card" id="result-card" hidden>
              <span class="result-check" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-9" /></svg>
              </span>
              <span>
                <strong>変換が完了しました</strong>
                <small id="result-summary"></small>
              </span>
              <a class="download-button" id="download-button" href="#" download>保存する</a>
            </div>
          </div>

          <aside class="preview-panel" aria-labelledby="preview-title">
            <div class="preview-heading">
              <span id="preview-title">仕上がりイメージ</span>
              <span id="ratio-badge">本文 1 : ノート 1</span>
            </div>
            <div class="preview-stage">
              <div class="preview-paper" id="preview-paper">
                <div class="preview-source">
                  <strong>PDF CONTENT</strong>
                  <i class="long"></i><i></i><i></i><i class="short"></i>
                  <i class="long space"></i><i></i><i class="short"></i>
                </div>
                <div class="preview-notes" id="preview-notes">
                  <span>NOTES</span>
                  <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
